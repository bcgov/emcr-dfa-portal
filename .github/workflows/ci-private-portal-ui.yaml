name: CI Private Portal UI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - support-develop
    paths:
      - "dfa/src/UI/embc-dfa/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install and build shared-ui
        run: |
          cd shared-workspace
          npm install
          npx ng build shared-ui

      - name: Install Dependencies
        run: |
          cd dfa/src/UI/embc-dfa
          npm install --ignore-scripts
          if [ $? -ne 0 ]; then
            echo "::error::Failed to install npm packages"
            exit 1
          fi

      - name: Build
        run: |
          cd dfa/src/UI/embc-dfa
          npm run build -- --configuration production
          if [ $? -ne 0 ]; then
            echo "::error::Build failed - check the logs above for compilation errors"
            exit 1
          fi
