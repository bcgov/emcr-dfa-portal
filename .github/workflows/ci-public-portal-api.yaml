name: CI Public Portal API

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - support-develop
    paths:
      - "dfa-public/src/API/**"
      - "shared/src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('dfa-public/src/API/**/*.csproj', 'shared/src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.414" # Install .NET 8.0.414 SDK
          global-json-file: dfa-public/src/API/global.json

      - name: Restore dependencies
        run: |
          dotnet restore dfa-public/src/API/EMBC.DFA.PUBLIC.API/EMBC.DFA.PUBLIC.API.csproj --disable-parallel  # Download all NuGet packages
          if [ $? -ne 0 ]; then
            echo "::error::Failed to restore NuGet packages"
            exit 1
          fi

      - name: Build
        run: |
          cd dfa-public/src/API
          dotnet build EMBC.DFA.PUBLIC.API/EMBC.DFA.PUBLIC.API.csproj --no-restore
          if [ $? -ne 0 ]; then
            echo "::error::Build failed - check the logs above for compilation errors"
            exit 1
          fi
