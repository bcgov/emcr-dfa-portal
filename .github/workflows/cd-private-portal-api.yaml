# ======================================================================================
#  Last Updated: 2025-12-19
#
#  Description:
#  This is the main CD workflow for the Private Portal API.
#  It orchestrates the build and deployment process for the API service.
#
#  Triggers:
#  1. Automatic (`push`): Triggers automatically when code is merged to 'support-develop' branch.
#  2. Manual (`workflow_dispatch`): Allows for manual deployments.
#
#  Note: Commit SHA and build metadata are automatically baked into image labels.
#
# ======================================================================================

name: CD Private Portal API

# --- TRIGGERS -----------------------------------------------------------------------
on:
  # Triggers this workflow when code is merged to support-develop branch
  push:
    branches: [support-develop]
    paths:
      - "dfa/src/API/**"
      - "shared/src/**"
      - ".github/workflows/cd-private-portal-api.yaml"

  # manual trigger
  workflow_dispatch:

# --- JOBS ---------------------------------------------------------------------------
jobs:
  # ------------------------------------------------------------------------------------
  #  Job: build-and-deploy
  #  Purpose: Calls the reusable build workflow to build, publish, and scan the image.
  # ------------------------------------------------------------------------------------
  build-and-deploy:
    permissions:
      # Core repository and deployment access
      contents: read              # Read repository files and clone code
      actions: read               # Read workflow runs and job information for private repo access
      packages: write             # Push Docker images to container registry
      # Environment and security
      id-token: write             # Required for environment protection and OIDC
      security-events: write      # Upload security scan results (Trivy SARIF)
    uses: ./.github/workflows/build-template.yml
    with:
      EVENT_NAME: ${{ github.event_name }}
      IMAGE_CONTEXT: .
      IMAGE_FILE: ./dfa/src/API/Dockerfile
      IMAGE_NAME: dfa-portal-api
      REGISTRY: ${{ vars.ARTIFACTORY_REGISTRY }}
      BRANCH: ${{ github.ref_name }}
    secrets:
      REGISTRY_USER: ${{ secrets.ARTIFACTORY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      OCP4_PASSWORD: ${{ secrets.OCP4_PASSWORD }}
      OCP4_NAMESPACE: ${{ secrets.OCP4_NAMESPACE }}
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
