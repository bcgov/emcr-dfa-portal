name: CI Landing Page

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - support-develop
    paths:
      - "landing-page/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Dependencies
        run: |
          cd landing-page
          npm install --ignore-scripts
          if [ $? -ne 0 ]; then
            echo "::error::Failed to install npm packages"
            exit 1
          fi

      - name: Build
        run: |
          cd landing-page
          npm run build -- --configuration production
          if [ $? -ne 0 ]; then
            echo "::error::Build failed - check the logs above for compilation errors"
            exit 1
          fi
