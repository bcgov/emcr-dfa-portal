<div class="container">
 
  <div class="row">
    <div class="header">
    <div>
      <div class="heading-container">
        <h1 class="heading">{{ appealType === 'eligibility' ? 'Eligibility Appeal' : 'Payment Amount Appeal' }}</h1>
      </div>
    </div>
    <div>
      <button
      class="button-p"
      mat-button
      type="button"
      (click)="returnToDashboard()"
    >
      Return to Dashboard
    </button>

    </div>
  </div>
  </div>

  <div *ngIf="isLoading" class="loading-indicator">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <div *ngIf="!isLoading">
    <mat-horizontal-stepper
      class="stepper-style"
      labelPosition="bottom"
      (animationDone)="currentStep(dfaAppealStepper?.selectedIndex)"
      (selectionChange)="stepChanged($event, dfaAppealStepper)"
      #dfaAppealStepper
      [linear]="true"
    >
      <mat-step *ngFor="let step of steps" [stepControl]="form">
        <ng-template matStepLabel>{{ step.stepName }}</ng-template>
        <app-component-wrapper
         *ngIf="isInitDone"
          [componentName]="step.component"
          [folderPath]="dfaAppealFolderPath"
        ></app-component-wrapper>
        <br />
        <div *ngIf="isEditView" class="row justify-content-between resp-style">
          <div class="col-md-6">
            <button
              class="button-s"
              mat-button
              type="button"
              (click)="goBack(dfaAppealStepper, step.lastStep)"
            >
              {{ step.backButtonLabel }}
            </button>
          </div>
          <div class="col-md-6 text-end">
            <button
              class="button-p"
              mat-button
              type="button"
              [disabled]="!canGoForward(step.component)"
              (click)="goForward(dfaAppealStepper, step.isLast, step.component)"
            >
              {{ step.nextButtonLabel }}
            </button>
          </div>
        </div>
      </mat-step>
    </mat-horizontal-stepper>
  </div>
</div>
