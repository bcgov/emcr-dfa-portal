<div class="p-3">
  <h2>{{ title }}</h2>

  <mat-dialog-content>
    <div class="d-flex flex-row">
      <div class="me-3">
        <mat-icon color="warn">warning</mat-icon>
      </div>
      <div class="flex-grow-1" [innerHTML]="content"></div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="d-flex justify-content-end">
    <button class="button-s button-width" mat-button (click)="cancel()">Ok</button>
  </mat-dialog-actions>
</div>
